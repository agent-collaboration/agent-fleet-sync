[package]
name = "fleet-sync-receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Runtime-independent replication copy rules over borrowed SQLx scopes"

[dependencies]
durable-steps = { path = "../durable-steps" }
sqlx-core = { workspace = true, features = ["migrate"] }
sqlx = { workspace = true, features = ["migrate", "macros"] }
fleet-sync-protocol = { path = "../fleet-sync-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
turso_parser.workspace = true
uuid = { version = "1.26.0", default-features = false, features = ["serde"] }

[build-dependencies]
fleet-sync-query-gen = { path = "../fleet-sync-query-gen" }

[dev-dependencies]
either.workspace = true
futures-util.workspace = true
durable-steps = { path = "../durable-steps", features = ["turso"] }
runtime-primitives.workspace = true
tempfile = "3.27.0"
sqlx-turso.workspace = true
tokio.workspace = true

[lints]
workspace = true
