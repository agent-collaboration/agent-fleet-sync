# Optional inherited test Worker; shares the repository lockfile and lint table.
[package]
name = "sqlx-durable-object-test-worker"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
sqlx-durable-object = { path = "../.." }
sqlx = { workspace = true, features = ["derive", "macros"] }
worker.workspace = true
wasm-bindgen.workspace = true
serde_json.workspace = true
futures-util.workspace = true
