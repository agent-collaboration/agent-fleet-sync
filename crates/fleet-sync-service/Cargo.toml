[package]
name = "fleet-sync-service"
description = "Native replication copies, lease registry and authenticated sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = {version="0.8.9",features=["ws"]}
durable-steps = {path="../durable-steps",features=["turso"]}
fleet-sync-protocol = {path="../fleet-sync-protocol"}
fleet-sync-receiver = {path="../fleet-sync-receiver"}
fleet-sync-lease = {path="../fleet-sync-lease"}
fleet-sync-session = {path="../fleet-sync-session"}
fleet-sync-tokio-runner = {path="../fleet-sync-tokio-runner"}
fleet-sync-transport-websocket = {path="../fleet-sync-transport-websocket"}
runtime-primitives = {path="../runtime-primitives",features=["tokio"]}
serde.workspace = true
serde_json.workspace = true
sqlx = {workspace=true,features=["migrate","macros"]}
sqlx-core = {workspace=true,features=["migrate"]}
sqlx-turso.workspace = true
thiserror.workspace = true
tokio = {workspace=true,features=["fs"]}
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
