[package]
name = "fleet-sync-query-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Checked portable SQL generation and build-time freshness verification"

[features]
default = []
native = ["dep:sqlx-core", "dep:sqlx-turso", "dep:tokio", "dep:turso_parser"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
sqlx-core = { workspace = true, optional = true, features = ["migrate"] }
sqlx-turso = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
turso_parser = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27.0"
durable-steps = { path = "../durable-steps" }

[[bin]]
name = "fleet-sync-query-gen"
path = "src/main.rs"
required-features = ["native"]

[lints]
workspace = true
