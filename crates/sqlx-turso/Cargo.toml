[package]
name = "sqlx-turso"
description = "SQLx driver for the Turso database engine: connections, checked queries and migrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["runtime-tokio", "macros", "migrate", "chrono"]
runtime-tokio = ["sqlx-turso-core/runtime-tokio"]
macros = ["dep:sqlx-turso-macros", "sqlx-turso-core/macros"]
migrate = ["sqlx-turso-core/migrate"]
chrono = ["sqlx-turso-core/chrono", "sqlx-turso-macros?/chrono"]

[dependencies]
sqlx.workspace = true
sqlx-turso-core.workspace = true
sqlx-turso-macros = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["macros", "migrate"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["fs"] }
trybuild.workspace = true

[[example]]
name = "seed_native_schema"
required-features = ["migrate"]

[[test]]
name = "checked_query_macros"
required-features = ["macros", "migrate", "chrono"]

[[test]]
name = "checked_query_diagnostics"
required-features = ["macros"]

[[test]]
name = "owned_migration_transactions"
required-features = ["macros", "migrate", "chrono"]

[[test]]
name = "foreign_key_enforcement"
required-features = ["macros", "migrate", "chrono"]

[[test]]
name = "turso_only_dependency_graph"
