[package]
name = "fleet-sync-tokio-runner"
description = "Native durable objects, owner-consumed timers and session hosting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["fleet-sync-writer/test-support"]

[dependencies]
durable-steps = { path = "../durable-steps", features = ["turso"] }
futures-util.workspace = true
turso.workspace = true
fleet-sync-protocol = {path="../fleet-sync-protocol"}
fleet-sync-receiver = {path="../fleet-sync-receiver"}
fleet-sync-session = {path="../fleet-sync-session"}
fleet-sync-writer = {path="../fleet-sync-writer"}
runtime-primitives = { path = "../runtime-primitives", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
sqlx-turso.workspace = true
sqlx-core.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
fleet-sync-lease = { path = "../fleet-sync-lease" }
tempfile = "3.27.0"

[build-dependencies]
fleet-sync-query-gen = { path = "../fleet-sync-query-gen", default-features = false }
