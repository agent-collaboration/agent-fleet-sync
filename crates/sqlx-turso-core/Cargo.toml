[package]
name = "sqlx-turso-core"
description = "SQLx driver internals for the Turso database engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["runtime-tokio"]
runtime-tokio = ["sqlx-core/_rt-tokio"]
migrate = ["sqlx-core/migrate"]
macros = [
    "dep:sqlx-macros-core",
    "sqlx-macros-core/macros",
    "sqlx-macros-core/_rt-tokio",
    "sqlx-macros-core/sqlx-toml",
]
chrono = ["dep:chrono", "sqlx-core/chrono"]

[dependencies]
chrono = { workspace = true, optional = true }
either.workspace = true
futures-core.workspace = true
futures-util.workspace = true
log.workspace = true
percent-encoding.workspace = true
serde.workspace = true
# `Executor::describe` exists only with sqlx-core's `offline` feature, so it is always on.
sqlx-core = { workspace = true, features = ["offline"] }
sqlx-macros-core = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
turso.workspace = true
turso_parser.workspace = true
url.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["time"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
