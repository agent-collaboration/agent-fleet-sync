[package]
name = "runtime-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared clock, identifiers, wake scheduling and bounded backoff"

[features]
default = []
tokio = ["dep:tokio", "uuid/v7", "uuid/std"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid = { version = "1.26.0", default-features = false, features = ["serde"] }
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time"], optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "time", "test-util", "sync"] }

[lints]
workspace = true
