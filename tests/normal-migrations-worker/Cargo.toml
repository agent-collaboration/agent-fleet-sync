[package]
name = "normal-migrations-worker"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false }
sqlx-core = { version = "=0.9.0", default-features = false }
sqlx-durable-object = { path = "../../crates/sqlx-durable-object" }
fleet-sync-protocol = { path = "../../crates/fleet-sync-protocol" }
fleet-sync-receiver = { path = "../../crates/fleet-sync-receiver" }
durable-steps = { path = "../../crates/durable-steps", features = ["durable-object"] }
runtime-primitives = { path = "../../crates/runtime-primitives", features = ["durable-object"] }
worker = { git = "https://github.com/cloudflare/workers-rs", rev = "b171cb4bdd6fa943bb81f429df0a6b0df37e14b3", default-features = false }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
debug = 0
incremental = false
