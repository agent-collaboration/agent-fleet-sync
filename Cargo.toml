[workspace]
resolver = "3"
members = ["crates/*", "tests/workerd/probe-core", "tests/workerd/probe-worker", "crates/sqlx-durable-object/tests/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-collaboration/agent-fleet-sync"

[workspace.dependencies]
chrono = "0.4.45"
either = "1.16.0"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
nix = { version = "0.28", features = ["user", "hostname"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.33"
percent-encoding = "2.3.2"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.46"
sqlx = { version = "=0.9.0", default-features = false }
sqlx-core = { version = "=0.9.0", default-features = false }
sqlx-macros-core = { version = "=0.9.0", default-features = false }
syn = { version = "2.0.118", features = ["full", "parsing"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
trybuild = "1.0.116"
turso = { version = "=0.8.1", default-features = false }
turso_parser = "=0.8.1"
url = "2.5.8"
sqlx-turso = { path = "crates/sqlx-turso" }
sqlx-turso-core = { path = "crates/sqlx-turso-core", default-features = false }
sqlx-turso-macros = { path = "crates/sqlx-turso-macros" }
worker = { git = "https://github.com/cloudflare/workers-rs", rev = "b171cb4bdd6fa943bb81f429df0a6b0df37e14b3", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
ureq = { version = "3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0
