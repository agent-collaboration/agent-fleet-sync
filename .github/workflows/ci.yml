name: CI
on:
  push:
    branches: [main, feat/foundation]
  pull_request:
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - run: cargo check --locked -p sqlx-turso --lib --no-default-features --features runtime-tokio
      - run: cargo test --locked -p sqlx-turso-core
      - run: node tests/durable-steps/check-query-metadata.mjs
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p sqlx-durable-object -p sqlx-durable-object-core -p probe-core -p probe-worker -p runtime-primitives -p durable-steps -p fleet-sync-protocol -p fleet-sync-session -p fleet-sync-receiver -p fleet-sync-lease -p fleet-sync-delivery --locked
      - run: cargo check --target wasm32-unknown-unknown -p durable-steps-worker --locked
      - run: cargo check --target wasm32-unknown-unknown -p durable-steps --no-default-features --locked
      - run: |
          cargo tree --target wasm32-unknown-unknown -p durable-steps --no-default-features --edges normal > core-dependencies.txt
          if grep -q tokio core-dependencies.txt; then
            cat core-dependencies.txt
            exit 1
          fi
          cargo tree --target wasm32-unknown-unknown -p fleet-sync-delivery --no-default-features --edges normal > delivery-dependencies.txt
          if grep -q tokio delivery-dependencies.txt; then
            cat delivery-dependencies.txt
            exit 1
          fi
  # Runs the durable-steps Durable Object store and the public migration SQL on
  # real workerd (Miniflare), not just a wasm32 compile.
  workerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npx pnpm@12.11.2 install --frozen-lockfile
      - run: cargo build -p durable-steps-worker --target wasm32-unknown-unknown --locked
      - run: wasm-bindgen --target bundler --no-typescript --out-dir tests/durable-steps/build --out-name index target/wasm32-unknown-unknown/debug/durable_steps_worker.wasm
      - run: cp tests/durable-steps/shim.mjs tests/durable-steps/build/shim.mjs
      - run: node tests/durable-steps/run-workerd.mjs
      - run: node tests/integration/public-migration-sql.mjs
  consumer:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path tests/consumer/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path tests/consumer/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path tests/consumer/Cargo.toml --all-features --locked
      - run: cargo run -p fleet-sync-query-gen --features native --locked -- --manifest tests/consumer/checked-queries.json --check
